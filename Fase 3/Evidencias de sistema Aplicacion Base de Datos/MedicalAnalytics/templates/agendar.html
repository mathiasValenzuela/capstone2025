<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendar Hora</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css">
    <style>
        :root {
            --primary: #0078D4;
            --primary-light: #4A9DFF;
            --primary-dark: #005A9E;
            --secondary: #00B294;
            --danger: #FF4D4D;
            --warning: #FF9D1E;
            --info: #00B0F0;
            --light: #F3F2F1;
            --dark: #201F1E;
            --gray: #EDEBE9;
            --gray-light: #F3F2F1;
            --gray-dark: #8A8886;
            --bg-light: #FFFFFF;
            --bg-dark: #252423;
            --text-light: #FFFFFF;
            --text-dark: #201F1E;
            /* Agrega estilos de sombra suave para los cards */
            --card-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--gray-light);
            color: var(--dark);
        }

        .navbar {
            background-color: var(--primary-dark);
        }
        .navbar .nav-link {
            color: var(--text-light) !important;
            font-weight: bold;
        }
        .navbar .nav-link:hover {
            color: var(--primary-light) !important;
        }
        .navbar .navbar-brand {
            color: var(--text-light) !important;
            font-weight: bold;
        }

        .header-content {
            background-color: var(--primary);
            color: var(--text-light);
            padding: 40px 0;
            text-align: center;
            margin-bottom: 30px;
        }
        .header-content h1 {
            font-size: 3em;
            margin-bottom: 10px;
        }
        .header-content p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .card {
            border: none;
            border-radius: 10px;
            box-shadow: var(--card-shadow);
            margin-bottom: 20px;
        }
        .card-header {
            background-color: var(--primary);
            color: var(--text-light);
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
            font-weight: bold;
        }
        .card-body {
            background-color: var(--bg-light);
            padding: 30px;
        }
        .form-label {
            font-weight: bold;
            color: var(--dark);
        }
        .form-control, .form-select {
            border-radius: 5px;
            border: 1px solid var(--gray-dark);
            padding: 10px;
            margin-bottom: 15px;
        }
        .btn-primary {
            background-color: var(--primary);
            border-color: var(--primary);
            padding: 10px 20px;
            font-size: 1.1em;
            border-radius: 5px;
        }
        .btn-primary:hover {
            background-color: var(--primary-dark);
            border-color: var(--primary-dark);
        }

        /* Estilos para la tabla de reservas */
        .reservas-table-container {
            margin-top: 40px;
        }
        .reservas-table-container .card-header {
            background-color: var(--secondary); /* Color diferente para distinguir */
        }
        .reservas-table-container table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        .reservas-table-container th,
        .reservas-table-container td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid var(--gray);
        }
        .reservas-table-container th {
            background-color: var(--primary-light);
            color: var(--text-light);
            font-weight: bold;
        }
        .reservas-table-container tbody tr:nth-child(even) {
            background-color: var(--gray-light);
        }
        .reservas-table-container tbody tr:hover {
            background-color: var(--gray);
            cursor: pointer;
        }
        .no-reservas-message {
            text-align: center;
            padding: 20px;
            color: var(--gray-dark);
        }

    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">MedicalAnalytics</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/dashboard">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="/agendar">Agendar Citas</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/asistencia">Asistente IA</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="header-content">
        <div class="container">
            <h1>Agenda tu Próxima Cita</h1>
            <p>Completa el formulario para reservar tu hora con nosotros.</p>
        </div>
    </div>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        Formulario de Agendamiento
                    </div>
                    <div class="card-body">
                        <form id="agendarForm">
                            <div class="mb-3">
                                <label for="rut" class="form-label">RUT</label>
                                <input type="text" class="form-control" id="rut" placeholder="Ej: 12345678-K" required>
                                <div class="invalid-feedback">RUT inválido.</div>
                            </div>
                            <div class="mb-3">
                                <label for="nombre" class="form-label">Nombre Completo</label>
                                <input type="text" class="form-control" id="nombre" placeholder="Ej: Juan Pérez" required>
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" placeholder="ejemplo@dominio.com">
                            </div>
                            <div class="mb-3">
                                <label for="telefono" class="form-label">Teléfono</label>
                                <input type="tel" class="form-control" id="telefono" placeholder="Ej: +56912345678">
                            </div>
                            <div class="mb-3">
                                <label for="fecha" class="form-label">Fecha</label>
                                <input type="date" class="form-control" id="fecha" required>
                            </div>
                            <div class="mb-3">
                                <label for="hora" class="form-label">Hora</label>
                                <input type="time" class="form-control" id="hora" required>
                            </div>
                            <div class="mb-3">
                                <label for="sala" class="form-label">Sala de Atención</label>
                                <select class="form-select" id="sala" required>
                                    <option value="">Seleccione una sala</option>
                                    <option value="Sala 1">Sala 1 - Pediatría</option>
                                    <option value="Sala 2">Sala 2 - Cardiología</option>
                                    <option value="Sala 3">Sala 3 - Neurología</option>
                                    <option value="Sala 4">Sala 4 - General</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Agendar Hora</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <div class="row justify-content-center reservas-table-container">
            <div class="col-md-10">
                <div class="card">
                    <div class="card-header">
                        Reservas Agendadas
                    </div>
                    <div class="card-body">
                        <div id="reservasTableContainer">
                            <p class="no-reservas-message" id="noReservasMessage">Cargando reservas...</p>
                            <table class="table table-striped table-hover d-none" id="reservasTable">
                                <thead>
                                    <tr>
                                        <th>Nombre Completo</th>
                                        <th>Fecha</th>
                                        <th>Hora</th>
                                        <th>Sala</th>
                                    </tr>
                                </thead>
                                <tbody id="reservasTableBody">
                                    </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const agendarForm = document.getElementById('agendarForm');
            const rutInput = document.getElementById('rut');
            const reservasTableContainer = document.getElementById('reservasTableContainer');
            const reservasTable = document.getElementById('reservasTable');
            const reservasTableBody = document.getElementById('reservasTableBody');
            const noReservasMessage = document.getElementById('noReservasMessage');

            // Función para formatear RUT
            function formatRut(rut) {
                // Elimina cualquier caracter que no sea número o k/K
                rut = rut.replace(/[^0-9kK]/g, ''); 

                // Si el RUT tiene más de un dígito, se agrega el guión antes del último
                if (rut.length > 1) {
                    rut = rut.slice(0, -1) + '-' + rut.slice(-1);
                }
                return rut.toUpperCase();
            }

            // Aplicar formato al RUT al escribir
            rutInput.addEventListener('input', (e) => {
                e.target.value = formatRut(e.target.value);
            });

            // Función para cargar y mostrar las reservas
            async function loadReservas() {
                noReservasMessage.textContent = "Cargando reservas...";
                noReservasMessage.classList.remove('d-none');
                reservasTable.classList.add('d-none');
                reservasTableBody.innerHTML = ''; // Limpiar tabla existente

                try {
                    const response = await fetch('/obtener-reservas');
                    const reservas = await response.json();

                    if (!response.ok) {
                        throw new Error(reservas.error || 'Error al cargar reservas');
                    }

                    if (reservas.length === 0) {
                        noReservasMessage.textContent = "No hay reservas agendadas aún.";
                        noReservasMessage.classList.remove('d-none');
                        reservasTable.classList.add('d-none');
                    } else {
                        noReservasMessage.classList.add('d-none');
                        reservasTable.classList.remove('d-none');
                        reservas.forEach(reserva => {
                            const row = reservasTableBody.insertRow(); // Corrected from insertCell() to insertRow()
                            row.insertCell(0).textContent = String(reserva.nombre); // Explicitly convert to string
                            row.insertCell(1).textContent = String(reserva.fecha); // Explicitly convert to string
                            row.insertCell(2).textContent = String(reserva.hora); // Explicitly convert to string
                            row.insertCell(3).textContent = String(reserva.salaId); // Explicitly convert to string
                        });
                    }
                } catch (error) {
                    console.error('Error cargando reservas:', error);
                    noReservasMessage.textContent = `Error al cargar las reservas: ${error.message}`;
                    noReservasMessage.classList.remove('d-none');
                    reservasTable.classList.add('d-none');
                }
            }

            // Manejar el envío del formulario de agendamiento
            agendarForm.addEventListener('submit', async (e) => {
                e.preventDefault(); // Evitar el envío por defecto del formulario

                const reserva = {
                    rut: rutInput.value,
                    nombre: document.getElementById('nombre').value,
                    email: document.getElementById('email').value,
                    telefono: document.getElementById('telefono').value,
                    fecha: document.getElementById('fecha').value,
                    hora: document.getElementById('hora').value,
                    salaId: document.getElementById('sala').value
                };

                // Validación básica
                if (!reserva.rut || !reserva.nombre || !reserva.fecha || !reserva.hora || !reserva.salaId) {
                    alert('Por favor, complete todos los campos obligatorios (RUT, Nombre, Fecha, Hora, Sala).');
                    return;
                }

                try {
                    const response = await fetch('/crear-reserva', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(reserva)
                    });

                    const result = await response.json();

                    if (!response.ok) {
                        throw new Error(result.error || 'Error al crear la reserva');
                    }

                    alert('Reserva creada exitosamente!');
                    agendarForm.reset(); // Limpiar el formulario
                    rutInput.value = ''; // Limpiar RUT input también
                    loadReservas(); // Recargar la tabla de reservas
                } catch (error) {
                    console.error('Error al crear reserva:', error);
                    alert(`Error al crear reserva: ${error.message}`);
                }
            });

            // Cargar reservas al cargar la página por primera vez
            loadReservas();
        });
    </script>
</body>
</html>
