<!DOCTYPE html>
<html>
<head>
    <title>Editar Paciente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css">
    <style>
        .form-container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .form-section {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .form-title {
            border-bottom: 2px solid #0d6efd;
            padding-bottom: 10px;
            margin-bottom: 20px;
            color: #0d6efd;
        }
    </style>
</head>
<body>
    <nav class="sidebar">
        <div class="mb-5">
            <h2 class="fw-bold mb-4"><i class="bi bi-heart-pulse"></i> MediAnalytics</h2>
            <div class="d-grid mb-3">
                <a href="/?mes={{ mes }}" class="btn btn-outline-light">
                    <i class="bi bi-arrow-left"></i> Volver
                </a>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <div class="form-container">
            <h2 class="mb-4">Editar Paciente: {{ paciente.Nombre }}</h2>
            
            <form method="POST" action="/actualizar/{{ mes }}/{{ paciente._id }}">
                <!-- Sección de información personal -->
                <div class="form-section">
                    <h3 class="form-title">Información Personal</h3>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Nombre</label>
                            <input type="text" class="form-control" name="Nombre" value="{{ paciente.Nombre }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">RUT</label>
                            <input type="text" class="form-control" name="RUT" value="{{ paciente.RUT }}" required>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Género</label>
                            <select class="form-select" name="Genero">
                                <option value="hombre" {% if paciente.Genero == 'hombre' %}selected{% endif %}>Hombre</option>
                                <option value="mujer" {% if paciente.Genero == 'mujer' %}selected{% endif %}>Mujer</option>
                                <option value="otro" {% if paciente.Genero == 'otro' %}selected{% endif %}>Otro</option>
                            </select>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Edad</label>
                            <input type="number" class="form-control" name="Edad" value="{{ paciente.Edad }}" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Estado</label>
                            <select class="form-select" name="Estado">
                                <option value="sano" {% if paciente.Estado == 'sano' %}selected{% endif %}>Sano</option>
                                <option value="estable" {% if paciente.Estado == 'estable' %}selected{% endif %}>Estable</option>
                                <option value="crítico" {% if paciente.Estado == 'crítico' %}selected{% endif %}>Crítico</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Fecha de Nacimiento</label>
                            <input type="text" class="form-control" name="FechaNacimiento" value="{{ paciente.FechaNacimiento }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Fecha de Atención</label>
                            <input type="text" class="form-control" name="FechaAtencion" value="{{ paciente.FechaAtencion }}">
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Enfermedades</label>
                        <input type="text" class="form-control" name="Enfermedades" value="{{ paciente.Enfermedades }}">
                    </div>
                </div>
                
                <!-- Sección de análisis sanguíneos -->
                <div class="form-section">
                    <h3 class="form-title">Análisis Sanguíneos</h3>
                    <div class="row">
                        <div class="col-md-3 mb-3">
                            <label class="form-label">Hb (g/dL)</label>
                            <input type="number" step="0.01" class="form-control" name="Hb_g/dL" value="{{ paciente.get('Hb_g/dL', '') }}">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">Hto (%)</label>
                            <input type="number" step="0.01" class="form-control" name="Hto_%" value="{{ paciente.get('Hto_%', '') }}">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">Glóbulos Rojos (mill/µL)</label>
                            <input type="number" step="0.01" class="form-control" name="Glóbulos_Rojos_mill/µL" value="{{ paciente.get('Glóbulos_Rojos_mill/µL', '') }}">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">VCM (fL)</label>
                            <input type="number" step="0.01" class="form-control" name="VCM_fL" value="{{ paciente.get('VCM_fL', '') }}">
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-3 mb-3">
                            <label class="form-label">HDL (mg/dL)</label>
                            <input type="number" step="0.01" class="form-control" name="HDL_mg/dL" value="{{ paciente.get('HDL_mg/dL', '') }}">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">LDL (mg/dL)</label>
                            <input type="number" step="0.01" class="form-control" name="LDL_mg/dL" value="{{ paciente.get('LDL_mg/dL', '') }}">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">Glucosa (mg/dL)</label>
                            <input type="number" step="0.01" class="form-control" name="Glucosa_en_ayunas_mg/dL" value="{{ paciente.get('Glucosa_en_ayunas_mg/dL', '') }}">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">Leucocitos (mil/µL)</label>
                            <input type="number" step="0.01" class="form-control" name="Leucocitos_mil/µL" value="{{ paciente.get('Leucocitos_mil/µL', '') }}">
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-3 mb-3">
                            <label class="form-label">Plaquetas (mil/µL)</label>
                            <input type="number" step="0.01" class="form-control" name="Plaquetas_mil/µL" value="{{ paciente.get('Plaquetas_mil/µL', '') }}">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">CHCM (g/dL)</label>
                            <input type="number" step="0.01" class="form-control" name="CHCM_g/dL" value="{{ paciente.get('CHCM_g/dL', '') }}">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">Na (mmol/L)</label>
                            <input type="number" step="0.01" class="form-control" name="Na_mmol/L" value="{{ paciente.get('Na_mmol/L', '') }}">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">K (mmol/L)</label>
                            <input type="number" step="0.01" class="form-control" name="K_mmol/L" value="{{ paciente.get('K_mmol/L', '') }}">
                        </div>
                    </div>
                </div>
                
                <!-- Sección de otros indicadores -->
                <div class="form-section">
                    <h3 class="form-title">Otros Indicadores</h3>
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">VO2 máx (ml/kg/min)</label>
                            <input type="number" step="0.01" class="form-control" name="VO2_máx_ml/kg/min" value="{{ paciente.get('VO2_máx_ml/kg/min', '') }}">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">FC máx alcanzada (lpm)</label>
                            <input type="number" step="0.01" class="form-control" name="FC_máx_alcanzada_lpm" value="{{ paciente.get('FC_máx_alcanzada_lpm', '') }}">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">IMC</label>
                            <input type="number" step="0.01" class="form-control" name="IMC" value="{{ paciente.get('IMC', '') }}">
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Presión Arterial Sistólica (mmHg)</label>
                            <input type="number" step="0.01" class="form-control" name="Presión_Arterial_Sistólica_mmHg" value="{{ paciente.get('Presión_Arterial_Sistólica_mmHg', '') }}">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Presión Arterial Diastólica (mmHg)</label>
                            <input type="number" step="0.01" class="form-control" name="Presión_Arterial_Diastólica_mmHg" value="{{ paciente.get('Presión_Arterial_Diastólica_mmHg', '') }}">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Presión sistólica post esfuerzo (mmHg)</label>
                            <input type="number" step="0.01" class="form-control" name="Presión_sistólica_post_esfuerzo_mmHg" value="{{ paciente.get('Presión_sistólica_post_esfuerzo_mmHg', '') }}">
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">HRR descenso en 1 min</label>
                            <input type="number" step="0.01" class="form-control" name="HRR_descenso_en_1_min" value="{{ paciente.get('HRR_descenso_en_1_min', '') }}">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Cloruro en sudor (mmol/L)</label>
                            <input type="number" step="0.01" class="form-control" name="Cloruro_en_sudor_mmol/L" value="{{ paciente.get('Cloruro_en_sudor_mmol/L', '') }}">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Volumen de sudor (mg)</label>
                            <input type="number" step="0.01" class="form-control" name="Volumen_de_sudor_mg" value="{{ paciente.get('Volumen_de_sudor_mg', '') }}">
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Colesterol Total (mg/dL)</label>
                            <input type="number" step="0.01" class="form-control" name="Colesterol_Total_mg/dL" value="{{ paciente.get('Colesterol_Total_mg/dL', '') }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Triglicéridos (mg/dL)</label>
                            <input type="number" step="0.01" class="form-control" name="Triglicéridos_mg/dL" value="{{ paciente.get('Triglicéridos_mg/dL', '') }}">
                        </div>
                    </div>
                </div>
                
                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-primary btn-lg">
                        <i class="bi bi-save"></i> Guardar Cambios
                    </button>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
