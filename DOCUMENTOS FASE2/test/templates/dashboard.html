<!DOCTYPE html>
<html>
<head>
    <title>Dashboard Estadístico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lodash@4.17.21/lodash.min.js"></script>
</head>
<body class="bg-light">
    <div class="container py-4">
        <h1 class="mb-4 text-primary">Análisis de Prioridades</h1>
        
        <!-- Gráfico Principal -->
        <div class="card shadow mb-4">
            <div class="card-body">
                <canvas id="priorityAnalysis"></canvas>
            </div>
        </div>

        <!-- Estadísticas Avanzadas -->
        <div class="row">
            <div class="col-md-4">
                <div class="card text-white bg-danger mb-3">
                    <div class="card-header">Máxima Prioridad</div>
                    <div class="card-body">
                        <h2 class="card-title">{{ max_priority }}%</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card text-white bg-warning mb-3">
                    <div class="card-header">Prioridad Promedio</div>
                    <div class="card-body">
                        <h2 class="card-title">{{ avg_priority }}%</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card text-white bg-success mb-3">
                    <div class="card-header">Mínima Prioridad</div>
                    <div class="card-body">
                        <h2 class="card-title">{{ min_priority }}%</h2>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const ctx = document.getElementById('priorityAnalysis').getContext('2d');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: {{ labels|safe }},
                datasets: [{
                    label: 'Nivel de Prioridad (%)',
                    data: {{ values|safe }},
                    backgroundColor: [
                        '#ff6384',
                        '#36a2eb',
                        '#cc65fe',
                        '#ffce56'
                    ],
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        position: 'top',
                    },
                    title: {
                        display: true,
                        text: 'Distribución de Prioridades por Paciente'
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        max: 100,
                        ticks: {
                            callback: function(value) {
                                return value + '%';
                            }
                        }
                    }
                }
            }
        });
    </script>
</body>
</html>
